# wrangler.toml — Cloudflare Worker (static assets only)
#
# The site is a fully static Next.js export, so this Worker has NO script:
# there is no `main` and no `[assets] binding`, because both are only valid
# when Worker code exists. Cloudflare serves `out/` straight from the edge,
# and requests to static assets are free and unlimited.
name = "sblwebsite"
compatibility_date = "2026-08-19"

[assets]
# Must match Next's export output (`output: "export"` in next.config.ts).
directory = "./out"

# Pages auto-detected this; Workers requires it to be explicit. The export
# generates out/404.html, so unmatched paths return that with a 404 status.
# (Use "single-page-application" only if this ever becomes a client-routed SPA.)
not_found_handling = "404-page"
